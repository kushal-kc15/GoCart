<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="signup">
        <form action="post">
            <label for="FirstName">First Name</label>
            <input type="text" id="text" name="first_name" placeholder="Enter your first name" required> <br>
            <label for="LastName">Last Name</label>
            <input type="text" id="text" name="last_name" placeholder="Enter your last name" required> <br>

            <label for="Email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="email@example.com" required> <br>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required><br> 

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required><br>
        
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required> <br>
        
            <label class="terms">
                <input type="checkbox" id="terms" required>
                I agree to the <a href="#">Terms &amp; Conditions</a><br>
            </label>
            <button type="submit">Sign Up</button>
        </form>
    </div>
</body>
</html>
