<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to GoCart</title>
</head>

<body style="margin:0; padding:0; background-color:#f6f1e5;">

    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f6f1e5;">
        <tr>
            <td align="center" style="padding:24px 12px;">

                <table width="600" cellpadding="0" cellspacing="0" border="0"
                       style="width:100%; max-width:600px; background-color:#ffffff; border-radius:8px;">

                    <!-- Brand bar -->
                    <tr>
                        <td align="center" bgcolor="#1f5f3a"
                            style="padding:24px 20px; background-color:#1f5f3a; border-radius:8px 8px 0 0; font-family:serif; font-size:28px; font-weight:bold; color:#ffffff;">
                            GoCart Grocery 
                        </td>
                    </tr>

                    <!-- Welcome message -->
                    <tr>
                        <td align="center" style="padding:32px 24px 8px 24px; font-family:Arial, Helvetica, sans-serif;">
                            <h1 style="margin:0 0 12px 0; font-family:Georgia, serif; font-size:26px; color:#1f5f3a;">
                                Welcome to GoCart, Barsha!
                            </h1>
                            <p style="margin:0; font-size:16px; line-height:24px; color:#6f716a;">
                                Your account is ready. Order fresh groceries and get them delivered to your door.
                            </p>
                        </td>
                    </tr>

                    <!-- Offer -->
                    <tr>
                        <td align="center" style="padding:24px 24px 8px 24px; font-family:Arial, sans-serif;">
                            <p style="margin:0; padding:16px; background-color:#eef6f0; border:2px dashed #1f5f3a; border-radius:8px; font-size:16px; line-height:24px; color:#33352f;">
                                Get <strong style="color:#1f5f3a;">10% off</strong> your first order<br>
                                with code <strong style="color:#1f5f3a;">GOCART10</strong>
                            </p>
                        </td>
                    </tr>

                    <!-- Button -->
                    <tr>
                        <td align="center" style="padding:24px 24px 32px 24px;">
                            <a href="https://example.com/shop"
                               style="display:inline-block; padding:13px 32px; background-color:#1f5f3a; border-radius:4px; font-family:Arial, Helvetica, sans-serif; font-size:16px; font-weight:bold; color:#ffffff; text-decoration:none;">
                                Start shopping
                            </a>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding:20px 24px 28px 24px; border-top:1px solid #e5e1d3; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:18px; color:#9a9c94; ">
                            Questions? Call +977-98XXXXXXXX or reply to this email.<br>
                            GoCart, Pokhara, Nepal<br>
                            <a href="https://example.com/unsubscribe" style="color:#9a9c94;">Unsubscribe</a>
                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>
</html>
