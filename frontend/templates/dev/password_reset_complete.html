{% extends "dev/base.html" %}
{% load static %}

{% block title %}Password changed — GoCart Fresh Groceries{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/dev/auth.css' %}">
<link rel="stylesheet" href="{% static 'css/dev/password_reset.css' %}">
{% endblock %}

{% block content %}
<section class="auth-section auth-section--reset" aria-labelledby="auth-heading">
  <div class="auth-wrapper auth-wrapper--reset">
    <div class="auth-form-panel">
      <div class="auth-form-card">
        <div class="auth-header">
          <p class="eyebrow eyebrow--green"><span></span>All done</p>
          <h1 id="auth-heading">Password changed</h1>
          <p class="auth-subtitle">Your new password is saved. You can log in with it now.</p>
        </div>
        <a href="{% url 'accounts:login' %}" class="button button--primary button--full button--lg">
          <span>Log in</span>
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
